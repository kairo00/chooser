    <!-- Google Fonts — must be in HTML to avoid PostCSS @import ordering issues -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fonts:
      · Dela Gothic One  → display / brand titles (very impactful)
      · Syne             → UI headings / body (editorial, distinctively geometric)
      · Syne Mono        → technical text, inputs, labels, room codes
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Syne:wght@400;500;600;700;800&family=Syne+Mono&display=swap"
      rel="stylesheet"
    />
